function compress(str) {
    let add="";
    let count=1;
    for(let i=0;i<str.length;i++){
        if (str[i]===str[i+1]) {
            count++;
        }else{
            add=add+str[i]+count;
            count=1;
        }
        
    }
return add
    
}
